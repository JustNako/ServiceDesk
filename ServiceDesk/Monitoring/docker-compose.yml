version: "3.7"
services:
  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/var/log
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo 
    networks:
      - monitoring-net
      - loki-net

  tempo:
    image: grafana/tempo:2.2.3
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    command: ["run", "-config.file=/etc/tempo.yaml"]
    networks:
      - monitoring-net

  grafana-agent:
    image: grafana/agent:latest
    ports:
      - "4317:4317"
    volumes:
      - ./grafana-agent.yaml:/etc/agent.yaml
    command: --config.file=/etc/agent.yaml
    networks:
      - monitoring-net
      - loki-net 

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    networks:
      - loki-net

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./logs:/var/log
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - loki-net

networks:
  monitoring-net:
    driver: bridge 
  loki-net:
    driver: bridge  

volumes:
  grafana-data:
  loki-data:
      
    
